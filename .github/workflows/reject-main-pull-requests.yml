name: Reject pull requests to main

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  use-staging:
    name: Use Staging instead of a PR to main
    runs-on: ubuntu-latest
    steps:
      - name: Explain the repository workflow
        run: |
          echo "::error title=Push to Staging::Pull requests to main are disabled. Work on Staging and push; CI promotes the tested commit automatically."
          exit 1

name: Tests

on:
  push:
    branches: [Staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reedleaves_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reedleaves_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Verify practice recovery with real PostgreSQL
        env:
          REED_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/reedleaves_test
          REED_TEST_POSTGRES_REQUIRED: "1"
          PG_POOL_SIZE: "8"
        run: node --import ./test-support/offline.mjs --test server/practice-recovery.postgres.test.mjs
      # npm test builds the React bundle in pretest and reuses this required PostgreSQL service.
      - name: Run the full suite with the PostgreSQL service
        env:
          REED_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/reedleaves_test
          REED_TEST_POSTGRES_REQUIRED: "1"
          PG_POOL_SIZE: "8"
        run: npm test

  promote:
    name: Promote Staging to main
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/Staging'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TESTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Ensure Staging contains current main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main "$TESTED_SHA"; then
            echo "::error::Staging is behind or diverged from main. Update Staging from main and push again."
            exit 1
          fi
      - name: Mark the tested commit successful for Render
        run: |
          gh api --method POST "repos/$GH_REPO/statuses/$TESTED_SHA" \
            -f state=success \
            -f context='Build and tests' \
            -f description='Full CI passed on Staging; this exact SHA is approved for production.' \
            -f target_url="https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
      - name: Fast-forward main to the tested commit
        run: git push origin "$TESTED_SHA:refs/heads/main"

name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to resume after updating its branch
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reedleaves_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reedleaves_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Verify practice recovery with real PostgreSQL
        env:
          REED_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/reedleaves_test
          REED_TEST_POSTGRES_REQUIRED: "1"
          PG_POOL_SIZE: "8"
        run: node --import ./test-support/offline.mjs --test server/practice-recovery.postgres.test.mjs
      # npm test builds the React bundle in pretest and reuses this required PostgreSQL service.
      # Local runs without this URL create their own disposable loopback container.
      - name: Run the full suite with the PostgreSQL service
        env:
          REED_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/reedleaves_test
          REED_TEST_POSTGRES_REQUIRED: "1"
          PG_POOL_SIZE: "8"
        run: npm test

  publish_status:
    name: Publish passing test status
    needs: test
    if: >-
      needs.test.result == 'success' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && inputs.pr_number != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Publish status for the tested SHA
        run: |
          pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          current_head=$(jq -r '.head.sha' <<<"$pr")
          current_ref=$(jq -r '.head.ref' <<<"$pr")
          head_repo=$(jq -r '.head.repo.full_name // empty' <<<"$pr")

          if [[ "$head_repo" != "$GH_REPO" || \
                "$current_ref" != "$PR_HEAD_REF" || \
                "$current_head" != "$PR_HEAD_SHA" ]]; then
            echo "PR identity or head SHA changed; refusing to publish a passing status." >&2
            exit 1
          fi

          gh api --method POST "repos/$GH_REPO/statuses/$PR_HEAD_SHA" \
            -f state=success \
            -f context='Build and tests' \
            -f description='npm test passed for this SHA' \
            -f target_url="https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID"

  merge:
    name: Merge PR
    needs: [test, publish_status]
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft) ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check PR freshness
        id: freshness
        run: |
          pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          current_head=$(jq -r '.head.sha' <<<"$pr")
          mergeable_state=$(jq -r '.mergeable_state' <<<"$pr")

          if [[ "$current_head" != "$PR_HEAD_SHA" ]]; then
            echo "::notice::PR head changed after this run started; the newer synchronize run must test it."
            echo "defer_merge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$mergeable_state" == "behind" ]]; then
            echo "PR is behind its base; updating the branch and dispatching tests for the new SHA."
            if ! result=$(gh api --method PUT "repos/$GH_REPO/pulls/$PR_NUMBER/update-branch" \
              -f expected_head_sha="$PR_HEAD_SHA" 2>&1); then
              printf 'Could not update the stale PR branch: %s\n' "$result" >&2
              exit 1
            fi
            echo "$result"

            # update-branch uses GITHUB_TOKEN, so its synchronize event may
            # not start a workflow. Wait for the new head, then dispatch a
            # run on that branch; its test job gates the merge job as usual.
            updated_head="$PR_HEAD_SHA"
            for attempt in {1..30}; do
              pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
              updated_head=$(jq -r '.head.sha' <<<"$pr")
              [[ "$updated_head" != "$PR_HEAD_SHA" ]] && break
              sleep 2
            done
            if [[ "$updated_head" == "$PR_HEAD_SHA" ]]; then
              echo "PR branch update was accepted, but its head SHA did not change in time." >&2
              exit 1
            fi

            gh workflow run tests.yml --repo "$GH_REPO" --ref "$PR_HEAD_REF" \
              -f pr_number="$PR_NUMBER"
            echo "defer_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "defer_merge=false" >> "$GITHUB_OUTPUT"
          fi
      # Only merge the tested head. GitHub still enforces branch protection
      # and refuses a stale/conflicting PR. This job never checks out PR code.
      - name: Merge the passing PR
        id: merge
        if: steps.freshness.outputs.defer_merge != 'true'
        run: >-
          gh api --method PUT "repos/$GH_REPO/pulls/$PR_NUMBER/merge"
          -f sha="$PR_HEAD_SHA" -f merge_method=squash
      # A merge made with GITHUB_TOKEN does not trigger push workflows.
      # Dispatch main explicitly so it gets checked before Render deploys.
      - name: Validate main for deployment
        if: steps.freshness.outputs.defer_merge != 'true' && steps.merge.outcome == 'success'
        run: gh workflow run tests.yml --repo "$GH_REPO" --ref main
      - name: Delete the merged branch
        if: steps.freshness.outputs.defer_merge != 'true' && steps.merge.outcome == 'success'
        run: |
          # GitHub's repository setting can leave the branch behind. Make
          # cleanup explicit; a branch already deleted by GitHub is also OK.
          if ! result=$(gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$PR_HEAD_REF" 2>&1); then
            if [[ "$result" != *"(HTTP 404)"* ]]; then
              printf '%s\n' "$result"
              exit 1
            fi
          fi

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">B · Papel: valoración unida y guardar como pestaña</title>
  <desc id="desc">Tarjeta de ejemplo con una placa compartida para no me gusta y me gusta en la esquina inferior derecha. Una pestaña separada permite guardar. Debajo se muestra el estado me gusta y guardada.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#173D2C" flood-opacity=".09"/>
    </filter>
    <g id="thumb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M10 15h3l4-7 1-5c.2-2 2.6-2.3 4-.7 2.3 2.5 1.6 6.7-.4 10.7H28c3 0 4 2.1 3.2 4.8L28.7 28c-.6 2.1-2 3-4.3 3h-9.1c-2.2 0-3.8-1.1-5.3-3z"/>
      <rect x="2" y="15" width="8" height="16" rx="2.3"/>
    </g>
    <g id="bookmark" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M8 3h16c1.7 0 3 1.3 3 3v25L16 24 5 31V6c0-1.7 1.3-3 3-3z"/>
    </g>
  </defs>
  <rect width="900" height="640" fill="#F1F2E8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#173D2C">
    <text x="70" y="43" font-size="19" font-weight="700">B · Papel</text>
    <text x="830" y="43" font-size="13" text-anchor="end" opacity=".65">Propuesta</text>
  </g>
  <rect x="78" y="91" width="746" height="446" rx="24" fill="#E4E5D6" transform="rotate(-1 450 305)"/>
  <rect x="70" y="80" width="760" height="450" rx="25" fill="#FFF9ED" filter="url(#shadow)"/>
  <g fill="#173D2C" font-family="Courier New, Courier, monospace">
    <text x="119" y="163" font-size="30" font-weight="700">Título de la tarjeta</text>
    <text x="119" y="215" font-size="20">Contenido de ejemplo.</text>
  </g>
  <g fill="#173D2C" opacity=".105">
    <rect x="119" y="248" width="590" height="9" rx="4.5"/>
    <rect x="119" y="277" width="545" height="9" rx="4.5"/>
    <rect x="119" y="306" width="585" height="9" rx="4.5"/>
    <rect x="119" y="335" width="438" height="9" rx="4.5"/>
  </g>
  <g fill="#173D2C" font-family="Arial, Helvetica, sans-serif" font-size="12" opacity=".5">
    <text x="119" y="461">Libro de ejemplo</text>
    <text x="119" y="480">Autor · Usuario</text>
  </g>
  <!-- Placa física compartida: dos objetivos de 76 × 64, separación interna estrecha. -->
  <g transform="translate(565 442) rotate(-2 76 32)">
    <rect x="0" y="5" width="152" height="64" rx="21" fill="#C9CFB2"/>
    <rect width="152" height="64" rx="21" fill="#F0F1DC" stroke="#173D2C" stroke-width="2"/>
    <path d="M76 13v38" stroke="#173D2C" stroke-width="1.5" opacity=".19"/>
    <g transform="translate(17 16)"><use href="#thumb" transform="rotate(180 16.5 16.5)" fill="none" stroke="#173D2C"/></g>
    <text x="54" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#173D2C" opacity=".65">2</text>
    <g transform="translate(91 13)"><use href="#thumb" fill="none" stroke="#173D2C"/></g>
    <text x="127" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#173D2C" opacity=".65">18</text>
  </g>
  <!-- Guardar forma una pestaña de papel independiente, con su propio gesto. -->
  <g transform="translate(751 424) rotate(2 28 53)">
    <path d="M0 11Q0 0 11 0h34q11 0 11 11v102L28 97 0 113z" fill="#D4D7BD" transform="translate(0 5)"/>
    <path d="M0 11Q0 0 11 0h34q11 0 11 11v102L28 97 0 113z" fill="#FFF9ED" stroke="#173D2C" stroke-width="2"/>
    <path d="M11 10h34" stroke="#173D2C" stroke-width="1.5" opacity=".2"/>
    <use href="#bookmark" x="12" y="31" fill="none" stroke="#173D2C"/>
  </g>
  <!-- Estado activo, presentado fuera de la tarjeta para comparar. -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#173D2C">
    <text x="70" y="589" font-size="13" opacity=".65">Me gusta y guardada</text>
  </g>
  <g transform="translate(565 560) scale(.85)">
    <rect x="0" y="5" width="152" height="64" rx="21" fill="#C9CFB2"/>
    <rect width="152" height="64" rx="21" fill="#F0F1DC" stroke="#173D2C" stroke-width="2"/>
    <path d="M76 13v38" stroke="#173D2C" stroke-width="1.5" opacity=".19"/>
    <g transform="translate(17 16)"><use href="#thumb" transform="rotate(180 16.5 16.5)" fill="none" stroke="#173D2C"/></g>
    <text x="54" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#173D2C" opacity=".65">2</text>
    <g transform="translate(91 13)"><use href="#thumb" fill="#58BE59" stroke="#173D2C"/></g>
    <text x="127" y="39" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#173D2C" opacity=".65">19</text>
  </g>
  <g transform="translate(751 555) scale(.85)">
    <path d="M0 11Q0 0 11 0h34q11 0 11 11v65L28 60 0 76z" fill="#1E4C2E"/>
    <path d="M11 10h34" stroke="#B9E877" stroke-width="1.5" opacity=".5"/>
    <use href="#bookmark" x="12" y="20" fill="#B9E877" stroke="#FFF9ED"/>
  </g>
</svg>

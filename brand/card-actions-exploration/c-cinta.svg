<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">C · Cinta: valoración y guardar una tarjeta</title>
  <desc id="desc">Tarjeta de ejemplo. Dos pulgares grandes próximos, con recuentos 2 y 18. Guardar aparece separado como una cinta de marcapáginas que cuelga del borde inferior. Debajo se muestra la selección de me gusta y guardado.</desc>
  <defs>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="155%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#173D2C" flood-opacity=".10"/></filter>
    <filter id="ribbon-shadow" x="-30%" y="-20%" width="170%" height="150%"><feDropShadow dx="3" dy="4" stdDeviation="2" flood-color="#173D2C" flood-opacity=".15"/></filter>
    <path id="thumb" d="M9 11 13.4 3.4C14.2 2 16.3 2.7 16.3 4.3v5h4.3c1.6 0 2.6 1.3 2.3 2.8l-1.5 7.2c-.2 1.1-1.2 1.8-2.3 1.8H9ZM3 11h3v10H3c-.6 0-1-.4-1-1v-8c0-.6.4-1 1-1Z"/>
  </defs>
  <rect width="900" height="640" fill="#F1F2E8"/>
  <g fill="#173D2C" font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="34" font-size="16" font-weight="700">C · Cinta</text>
  </g>
  <rect x="79" y="68" width="760" height="450" rx="20" fill="#DDE5D4" transform="rotate(1 459 293)"/>
  <rect x="70" y="60" width="760" height="450" rx="20" fill="#FFF9ED" filter="url(#paper-shadow)"/>
  <g fill="#173D2C">
    <text x="116" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" opacity=".52">Tarjeta de ejemplo</text>
    <text x="116" y="192" font-family="Georgia, serif" font-size="35">Título de la tarjeta</text>
    <g font-family="Courier New, monospace" font-size="21">
      <text x="116" y="247">Este espacio contiene una idea del libro.</text>
      <text x="116" y="280">Las acciones están al pie de la tarjeta.</text>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="13" opacity=".48">
      <text x="116" y="446">Libro de ejemplo</text>
      <text x="116" y="466">Autor · Creador de la baraja</text>
    </g>
  </g>
  <!-- Each vote occupies a 60 × 60 target; the two votes are adjacent. -->
  <g stroke="#173D2C" stroke-width="2" stroke-linejoin="round" fill="none">
    <g transform="translate(584 434)"><rect width="60" height="60" stroke="none"/><use href="#thumb" transform="translate(6 3) scale(1.6) rotate(180 12 12)"/></g>
    <g transform="translate(650 434)"><rect width="60" height="60" stroke="none"/><use href="#thumb" transform="translate(6 3) scale(1.6)"/></g>
  </g>
  <g fill="#173D2C" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">
    <text x="628" y="467">2</text><text x="694" y="467">18</text>
  </g>
  <!-- A separate bookmark ribbon attaches directly to the paper. -->
  <g filter="url(#ribbon-shadow)">
    <path d="M744 438h58v108l-29-19-29 19Z" fill="#EFECD8" stroke="#173D2C" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M753 440v86m40-86v86" stroke="#173D2C" stroke-width="1" opacity=".16"/>
    <path d="M765 470h16m-8-8v16" fill="none" stroke="#173D2C" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <g fill="#173D2C" font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="600" font-size="14" opacity=".65">Me gusta + guardado</text>
  </g>
  <!-- Independent saved state and a single selected vote. -->
  <g stroke="#173D2C" stroke-width="2" stroke-linejoin="round">
    <use href="#thumb" transform="translate(590 570) scale(1.35) rotate(180 12 12)" fill="none"/>
    <use href="#thumb" transform="translate(656 570) scale(1.35)" fill="#58BE59"/>
  </g>
  <g fill="#173D2C" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">
    <text x="628" y="596">2</text><text x="694" y="596">19</text>
  </g>
  <path d="M751 564h44v58l-22-14-22 14Z" fill="#173D2C"/>
  <path d="m764 584 6 6 12-13" fill="none" stroke="#B9E877" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

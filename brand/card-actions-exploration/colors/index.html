<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reedleaves · Colores de acciones · Propuesta</title>
<link rel="stylesheet" href="../../../app/reader.css">
<style>
body{min-height:100vh}.demo-background{width:min(680px,calc(100% - 40px));margin:40px auto}.demo-background h1{font-size:24px;margin-bottom:30px}.album-placeholder{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.album-placeholder div{height:160px;background:#ecf2dc;border:1.5px solid #a1b48a;border-radius:20px}.demo-palette{position:absolute;left:0;top:0;max-width:calc(100% - 50px);font:inherit;font-size:13px;border:1px solid #a1b48a;border-radius:12px;background:#fff9ed;padding:10px;min-height:42px;color:#51654c}.exclusive-card-controls{position:relative}.card-actions{position:relative;width:200px;height:66px;flex:0 0 200px;direction:ltr}.vote-plate{position:absolute;top:0;left:0;width:112px;height:74px;overflow:visible}.vote-target{position:absolute;top:2px;width:54px;height:64px;border:0;background:transparent;border-radius:18px;padding:0;cursor:pointer}.vote-target[data-vote="-1"]{left:2px}.vote-target[data-vote="1"]{left:56px}.save-target{position:absolute;right:0;top:-18px;width:64px;height:124px;border:0;background:transparent;padding:0;cursor:pointer}.save-target svg{width:64px;height:124px;overflow:visible}.vote-target:focus-visible,.save-target:focus-visible{outline:2px solid var(--action-ink);outline-offset:4px}.card-actions svg{overflow:visible}.card-actions [data-counter]{fill:#51654c;font-family:Arial,sans-serif;font-size:12px;text-anchor:middle}.card-actions [data-thumb]{stroke:var(--action-ink);fill:none}.card-actions[data-vote="-1"] [data-thumb="-1"],.card-actions[data-vote="1"] [data-thumb="1"]{fill:#58be59}.save-target [data-tick]{display:none}.save-target[aria-pressed="true"] [data-plus]{display:none}.save-target[aria-pressed="true"] [data-tick]{display:block}.reading-attribution{font-size:12px;color:#51654c;line-height:1.8}.exclusive-card-modal .reading-stage .idea-card{min-height:min(66dvh,680px)}.idea-body{margin-bottom:40px}.demo-close{border:0;background:none}.palette-note{position:absolute;bottom:0;left:0;font-size:12px;color:#51654c;transform:translateY(30px)}@media(max-width:600px){.card-actions{width:184px;flex-basis:184px}.reading-attribution{font-size:10px}.demo-palette{font-size:11px}.exclusive-card-modal .reading-stage .idea-card{padding-bottom:36px}.reading-footer{gap:4px!important}}
</style>
<div class="demo-background" aria-hidden="true"><h1>Baraja de ejemplo</h1><div class="album-placeholder"><div></div><div></div><div></div><div></div><div></div><div></div></div></div>
<dialog class="exclusive-card-modal" aria-label="Propuesta de acciones de tarjeta">
<div class="exclusive-card-shell">
<div class="exclusive-card-controls"><select class="demo-palette" aria-label="Propuesta de color"><option value="salvia">Salvia</option><option value="oliva">Oliva</option><option value="botanico">Gris botánico</option><option value="tierra">Tierra</option></select><button class="exclusive-card-close demo-close" aria-label="Cerrar tarjeta" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
<div class="reading-stage"><article class="idea-card"><h1>Título de la tarjeta</h1><p class="idea-body">Este es el contenido de una tarjeta de ejemplo. Las acciones permiten valorar la tarjeta y guardarla.</p>
<footer class="reading-footer"><div class="reading-attribution">Libro de ejemplo<br>Autor<br>Usuario</div>
<div class="card-actions" data-vote="0">
<svg class="vote-plate" viewBox="0 0 112 74" aria-hidden="true">
<defs><g id="thumb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M10 15h3l4-7 1-5c.2-2 2.6-2.3 4-.7 2.3 2.5 1.6 6.7-.4 10.7H28c3 0 4 2.1 3.2 4.8L28.7 28c-.6 2.1-2 3-4.3 3h-9.1c-2.2 0-3.8-1.1-5.3-3z"/><rect x="2" y="15" width="8" height="16" rx="2.3"/></g></defs>
<g transform="translate(2 2) rotate(-2 54 32)"><rect y="5" width="108" height="64" rx="21" fill="#C9CFB2"/><rect width="108" height="64" rx="21" fill="#F0F1DC" stroke="var(--action-outline)" stroke-width="2"/><path d="M54 13v38" stroke="var(--action-outline)" stroke-width="1.5" opacity=".55"/><use data-thumb="-1" href="#thumb" transform="translate(14.9 21) scale(1.1) rotate(180 16.5 16.5)"/><use data-thumb="1" href="#thumb" transform="translate(56.8 6.7) scale(1.1)"/><text data-counter="-1" x="28" y="18">2</text><text data-counter="1" x="80" y="57">18</text></g>
</svg>
<button class="vote-target" type="button" data-vote="-1" aria-label="No me gusta" aria-pressed="false"></button><button class="vote-target" type="button" data-vote="1" aria-label="Me gusta" aria-pressed="false"></button>
<button class="save-target" type="button" aria-label="Guardar tarjeta" aria-pressed="false"><svg viewBox="0 0 64 124" aria-hidden="true"><g transform="translate(4 2) rotate(2 28 53)"><path d="M0 11Q0 0 11 0h34q11 0 11 11v102L28 97 0 113z" fill="#D4D7BD" transform="translate(0 5)"/><path d="M0 11Q0 0 11 0h34q11 0 11 11v102L28 97 0 113z" fill="#FFF9ED" stroke="var(--action-outline)" stroke-width="2"/><path d="M11 10h34" stroke="var(--action-outline)" stroke-width="1.5" opacity=".4"/><path data-plus d="M20 48h16m-8-8v16" fill="none" stroke="var(--action-ink)" stroke-width="3.2" stroke-linecap="round"/><path data-tick d="m19 47 6 6 13-14" fill="none" stroke="#58BE59" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g></svg></button>
</div></footer></article></div>
</div></dialog>
<script>
const palettes={salvia:{label:'Salvia',outline:'#8FA38A',ink:'#6E916A'},oliva:{label:'Oliva',outline:'#9A9E80',ink:'#7B805D'},botanico:{label:'Gris botánico',outline:'#9CAAA0',ink:'#708477'},tierra:{label:'Tierra',outline:'#AA9C87',ink:'#8C7B65'}};
const picker=document.querySelector('.demo-palette');const actions=document.querySelector('.card-actions');const save=document.querySelector('.save-target');
function setPalette(key){const palette=palettes[key]||palettes.salvia;document.documentElement.style.setProperty('--action-outline',palette.outline);document.documentElement.style.setProperty('--action-ink',palette.ink);picker.value=palettes[key]?key:'salvia'}
setPalette(new URLSearchParams(location.search).get('palette')||'salvia');picker.addEventListener('change',()=>setPalette(picker.value));
document.querySelectorAll('.vote-target').forEach(button=>button.addEventListener('click',()=>{const vote=actions.dataset.vote===button.dataset.vote?'0':button.dataset.vote;actions.dataset.vote=vote;document.querySelectorAll('.vote-target').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.vote===vote)));document.querySelector('[data-counter="-1"]').textContent=vote==='-1'?'3':'2';document.querySelector('[data-counter="1"]').textContent=vote==='1'?'19':'18'}));
save.addEventListener('click',()=>{const saved=save.getAttribute('aria-pressed')!=='true';save.setAttribute('aria-pressed',String(saved));save.setAttribute('aria-label',saved?'Quitar tarjeta de guardadas':'Guardar tarjeta')});
document.querySelector('.demo-close').addEventListener('click',()=>document.querySelector('dialog').close());document.querySelector('dialog').showModal();
</script>
</html>

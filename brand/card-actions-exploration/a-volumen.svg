  <title id="title">Propuesta A: botones con volumen</title>
  <desc id="desc">Tarjeta falsa con la pareja no me gusta y me gusta dentro de una cápsula, y guardar separado como ficha melocotón. Debajo se muestran me gusta seleccionado y tarjeta guardada.</desc>

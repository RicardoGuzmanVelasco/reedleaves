<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barra inferior · propuestas</title>
<style>
:root{font-family:"Avenir Next Rounded","Arial Rounded MT Bold","Avenir Next",system-ui,sans-serif;color:#173d2c;background:#fff9ed;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{width:min(550px,100%);margin:auto;padding:38px 18px 70px;display:grid;gap:67px}figure{margin:0;min-width:0}figcaption{font-size:11px;font-weight:700;letter-spacing:.035em;color:#66725a;margin:0 0 53px 5px}nav{--piece:#e8d3a4;--edge:#bca06d;--active:#c5dd9c;--active-edge:#8ca868;position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;isolation:isolate;padding:0 2px 33px}button{position:relative;display:block;height:77px;min-width:0;padding:0;border:0;background:transparent;color:#173d2c;font:inherit;font-size:11px;font-weight:750;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;isolation:isolate}button:before{content:"";position:absolute;inset:0;z-index:-1;background:var(--piece);border:1.5px solid var(--edge);border-radius:18px 15px 19px 14px;box-shadow:0 5px 0 var(--edge);transform:rotate(var(--tilt,-2deg));transition:background .22s ease,transform .22s ease}button:nth-child(2){--tilt:2deg}button:nth-child(3){--tilt:-1deg}button:nth-child(4){--tilt:1.5deg}button:nth-child(5){--tilt:-1.5deg}.icon{position:absolute;inset:12px 0 auto;display:flex;justify-content:center;align-items:center;height:49px;transition:transform .32s cubic-bezier(.2,.9,.3,1.25)}.icon img,.icon svg{display:block;width:46px;height:46px;object-fit:contain;flex:none;transition:width .32s ease,height .32s ease}.bottom-navigation-profile-icon{fill:currentColor}.label{position:absolute;top:88px;left:50%;transform:translate(-50%,6px);white-space:nowrap;opacity:0;transition:opacity .18s ease,transform .25s ease;pointer-events:none}button[aria-current=page]{z-index:2}button[aria-current=page]:before{inset:-25px -1px -8px;background:var(--active);border-color:var(--active-edge);border-radius:25px 23px 17px 18px;box-shadow:0 5px 0 var(--active-edge);transform:rotate(-2deg)}button[aria-current=page] .icon{transform:translateY(-39px)}button[aria-current=page] .icon img,button[aria-current=page] .icon svg{width:78px;height:78px}button[aria-current=page] .label{opacity:1;transform:translate(-50%,0)}button:focus-visible{outline:3px solid #9c602d;outline-offset:7px;border-radius:18px}button:active:before{transform:translateY(4px) rotate(0);box-shadow:0 1px 0 var(--edge)}
/* A: madera separada y pieza seleccionada verde, con corte de marcapáginas. */
.wood button[aria-current=page]:before{border:0;border-radius:24px 23px 0 0;bottom:-13px;clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);box-shadow:none;background:linear-gradient(var(--active) 0 91%,var(--active-edge) 91%)}
/* B: base vegetal continua y un marcapáginas de papel que emerge. */
.green{--piece:#dbe8bd;--edge:#acc28b;--active:#f0e0b8;--active-edge:#c0a674;gap:4px;padding:7px 9px 34px}.green:before{content:"";position:absolute;inset:7px 0 24px;background:#dbe8bd;border-radius:30px 26px 25px 23px;box-shadow:0 5px 0 #acc28b;z-index:-2}.green .label{top:98px}.green button:before{background:transparent;border:0;box-shadow:none}.green button[aria-current=page]:before{background:linear-gradient(var(--active) 0 92%,var(--active-edge) 92%);border:0;border-radius:24px 24px 0 0;bottom:-16px;clip-path:polygon(0 0,100% 0,100% 100%,50% 87%,0 100%)}
/* C: piezas verdes independientes y marcador de madera. */
.mixed{--piece:#d7e5b5;--edge:#a6bd83;--active:#e7ce99;--active-edge:#b79b65}.mixed button:nth-child(even):before{background:#e0eac8}.mixed button[aria-current=page]:before{background:linear-gradient(var(--active) 0 92%,var(--active-edge) 92%);border:0;border-radius:24px 23px 0 0;bottom:-13px;clip-path:polygon(0 0,100% 0,100% 100%,50% 87%,0 100%)}
@media(max-width:380px){main{padding-inline:14px}nav{gap:5px}button{height:70px;font-size:10px}.icon{top:10px}.icon img,.icon svg{width:42px;height:42px}button[aria-current=page] .icon img,button[aria-current=page] .icon svg{width:70px;height:70px}.label{top:82px}.green{padding-inline:6px;gap:2px}.green .label{top:92px}}
@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}}
</style>
<main></main>
<script type="module">
import {bottomNavigationProfileIconMarkup,calendarIconMarkup} from '../../../app/views.mjs';
const root='../../../';
const icons=[`<img src="${root}brand/icons/collections/library.svg" alt="">`,`<img src="${root}brand/icons/collections/bookcase.svg" alt="">`,`<img src="${root}brand/reed/mascot.svg" alt="">`,bottomNavigationProfileIconMarkup(),calendarIconMarkup()];
const labels=['Librería','Biblioteca','Inicio','Perfil','Idea del día'];
const variants=[['A · Madera + marcapáginas verde','wood'],['B · Verde continuo + marcapáginas de papel','green'],['C · Piezas verdes + marcapáginas de madera','mixed']];
document.querySelector('main').innerHTML=variants.map(([name,style])=>`<figure><figcaption>${name}</figcaption><nav class="${style}" aria-label="${name}">${labels.map((label,i)=>`<button type="button" aria-label="${label}" title="${label}" class="${i===2?'home':''}" ${i===2?'aria-current="page"':''}><span class="icon" aria-hidden="true">${icons[i]}</span><span class="label" aria-hidden="true">${label}</span></button>`).join('')}</nav></figure>`).join('');
document.querySelectorAll('nav').forEach(nav=>nav.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;nav.querySelectorAll('button').forEach(item=>item.removeAttribute('aria-current'));button.setAttribute('aria-current','page');}));
</script></html>

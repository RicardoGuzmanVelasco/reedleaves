<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barra inferior · propuestas</title>
<style>
:root{font-family:"Avenir Next Rounded","Arial Rounded MT Bold","Avenir Next",system-ui,sans-serif;color:#173d2c;background:#fff9ed;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{width:min(550px,100%);margin:auto;padding:65px 18px 85px}figure{margin:0;min-width:0}figcaption{font-size:11px;font-weight:700;letter-spacing:.035em;color:#66725a;margin:0 0 68px 5px}nav{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;isolation:isolate;padding:0 2px 40px}button{position:relative;display:block;height:77px;min-width:0;padding:0;border:0;background:transparent;color:#173d2c;font:inherit;font-size:11px;font-weight:750;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;isolation:isolate}button:before{content:"";position:absolute;inset:0;z-index:-1;background:#e8d3a4;border:1.5px solid #bca06d;border-radius:18px 15px 19px 14px;box-shadow:0 5px 0 #bca06d;transform:rotate(var(--tilt,-2deg));transition:opacity .2s ease,transform .2s ease}button:nth-child(2){--tilt:2deg}button:nth-child(3){--tilt:-1deg}button:nth-child(4){--tilt:1.5deg}button:nth-child(5){--tilt:-1.5deg}.bookmark{position:absolute;left:-1px;top:-25px;width:calc(100% + 2px);height:calc(100% + 50px);overflow:visible;z-index:-1;opacity:0;transform:translateY(10px);transition:opacity .18s ease,transform .28s ease;pointer-events:none}.bookmark path{vector-effect:non-scaling-stroke;stroke-linejoin:round}.bookmark .depth{fill:#8ca868;stroke:#8ca868;stroke-width:1.5}.bookmark .face{fill:#c5dd9c;stroke:#8ca868;stroke-width:1.5}.icon{position:absolute;inset:12px 0 auto;display:flex;justify-content:center;align-items:center;height:49px;transition:transform .3s cubic-bezier(.2,.8,.3,1)}.icon img,.icon svg{display:block;width:46px;height:46px;max-width:92%;object-fit:contain;flex:none;transition:width .3s ease,height .3s ease}.bottom-navigation-profile-icon{fill:currentColor}.label{position:absolute;top:60px;left:3px;right:3px;line-height:13px;text-align:center;opacity:0;transform:translateY(5px);transition:opacity .18s ease,transform .25s ease;pointer-events:none}button[aria-current=page]{z-index:2}button[aria-current=page]:before{opacity:0}button[aria-current=page] .bookmark{opacity:1;transform:none}button[aria-current=page] .icon{transform:translateY(-18px)}button[aria-current=page] .icon img,button[aria-current=page] .icon svg{width:66px;height:66px}button[aria-current=page] .label{opacity:1;transform:none}button:focus-visible{outline:3px solid #9c602d;outline-offset:7px;border-radius:18px}button:active:before{transform:translateY(4px) rotate(0);box-shadow:0 1px 0 #bca06d}button:active .bookmark{transform:translateY(3px)}
@media(max-width:380px){main{padding-inline:14px}nav{gap:5px}button{height:70px;font-size:10px}.icon{top:10px}.icon img,.icon svg{width:42px;height:42px}button[aria-current=page] .icon img,button[aria-current=page] .icon svg{width:60px;height:60px}button[aria-current=page] .icon{transform:translateY(-15px)}.label{top:54px;line-height:12px}}
@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}}
</style>
<main></main>
<script type="module">
import {bottomNavigationProfileIconMarkup,calendarIconMarkup} from '../../../app/views.mjs';
const root='../../../';
const icons=[`<img src="${root}brand/icons/collections/library.svg" alt="">`,`<img src="${root}brand/icons/collections/bookcase.svg" alt="">`,`<img src="${root}brand/reed/d-compacto.svg" alt="">`,bottomNavigationProfileIconMarkup(),calendarIconMarkup()];
const labels=['Librería','Biblioteca','Inicio','Perfil','Idea del día'];
const variants=[['A · Madera + marcapáginas verde · refinado','wood']];
const shape='M22 2 Q2 2 2 22 L2 126 L50 112 L98 126 L98 22 Q98 2 78 2 Z';
const bookmark=`<svg class="bookmark" viewBox="0 0 100 134" preserveAspectRatio="none" aria-hidden="true"><path class="depth" d="${shape}" transform="translate(0 5)"/><path class="face" d="${shape}"/></svg>`;
document.querySelector('main').innerHTML=variants.map(([name,style])=>`<figure><figcaption>${name}</figcaption><nav class="${style}" aria-label="${name}">${labels.map((label,i)=>`<button type="button" aria-label="${label}" title="${label}" class="${i===2?'home':''}" ${i===2?'aria-current="page"':''}>${bookmark}<span class="icon" aria-hidden="true">${icons[i]}</span><span class="label" aria-hidden="true">${label}</span></button>`).join('')}</nav></figure>`).join('');
document.querySelectorAll('nav').forEach(nav=>nav.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;nav.querySelectorAll('button').forEach(item=>item.removeAttribute('aria-current'));button.setAttribute('aria-current','page');}));
</script></html>

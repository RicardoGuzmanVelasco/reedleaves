<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barra inferior · propuestas</title>
<style>
:root{font-family:"Avenir Next Rounded","Arial Rounded MT Bold","Avenir Next",system-ui,sans-serif;color:#173d2c;background:#fff9ed;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{width:min(560px,100%);margin:auto;padding:38px 16px 60px;display:grid;gap:58px}figure{margin:0;min-width:0}figcaption{font-size:11px;font-weight:700;letter-spacing:.05em;color:#66725a;margin:0 0 20px 6px}nav{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;isolation:isolate}button{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;min-height:76px;min-width:0;padding:10px 1px;border:0;background:transparent;color:#173d2c;font:inherit;font-size:10px;font-weight:750;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .18s ease,background .18s ease}button img,button svg{display:block;width:29px;height:29px;object-fit:contain;flex:none}button .bottom-navigation-profile-icon{fill:currentColor}button span{position:relative;white-space:nowrap}button:focus-visible{outline:3px solid #a56429;outline-offset:3px;z-index:4}button:active{transform:translateY(3px)!important}.home img{width:37px;height:37px}.home{gap:2px}button[aria-current=page] img,button[aria-current=page] svg{transform:rotate(-5deg)}
/* A — papel: borde vivo y una pequeña impresión hundida. */
.paper{padding:8px 10px 12px;background:#eee2bf;border-radius:32% 18% 22% 14% / 13px 16px 13px 17px;box-shadow:0 5px 0 #cbbb94,0 10px 14px #493c1d0c}.paper:before{content:"";position:absolute;inset:3px 5px 5px;border:1px solid #bba9786b;border-radius:inherit;pointer-events:none}.paper button{border-radius:39% 45% 38% 43% / 38% 40% 35% 42%}.paper button[aria-current=page]{background:#d1dfa8;box-shadow:inset 0 2px 0 #a8b97c66}.paper .home{margin-top:-18px;min-height:94px}.paper .home img{width:46px;height:46px}
/* B — pièces: cinco superficies táctiles con pequeñas diferencias. */
.wood{gap:5px;padding:0 2px}.wood button{background:#e4cf9f;border:1.5px solid #b89b66;box-shadow:0 5px 0 #b89b66;border-radius:18px 15px 19px 14px;transform:rotate(-2deg)}.wood button:nth-child(2){transform:rotate(2deg);background:#eddbb5}.wood button:nth-child(4){transform:rotate(1deg);background:#eddbb5}.wood button:nth-child(5){transform:rotate(-1deg)}.wood button[aria-current=page]{background:#b9d78a;border-color:#78995f;box-shadow:0 5px 0 #78995f}.wood .home{min-height:91px;transform:rotate(-3deg)}
/* C — bancal: la marca sale de una base verde con relieve. */
.garden{padding:5px 9px 10px;border-radius:37px 29px 24px 27px;background:#d9e7b8;box-shadow:0 5px 0 #a6bf7b}.garden:before{content:"";position:absolute;left:9%;right:9%;height:2px;bottom:7px;background:#9eb87966;border-radius:100%}.garden button{border-radius:24px 22px 18px 21px}.garden button[aria-current=page]{background:#fdf8e8;box-shadow:0 3px 0 #afc786}.garden .home{min-height:100px;margin-top:-24px;background:#d9e7b8;border-radius:49% 51% 0 0}.garden .home[aria-current=page]{background:#fff9ed;border-radius:46% 50% 24% 28%;box-shadow:0 3px 0 #afc786}.garden .home img{width:49px;height:49px}
/* D — marcadores: encuadernación, pestañas y una selección que asoma. */
.tabs{gap:2px;padding:0 8px 8px;background:linear-gradient(transparent 20px,#d1ba8c 20px,#d1ba8c 23px,#eee1c1 23px);border-radius:0 0 14px 14px;box-shadow:0 4px 0 #c2aa7c}.tabs button{min-height:84px;background:#e7dbbb;border:1px solid #ccbc98;border-radius:15px 14px 5px 5px;margin-top:15px;box-shadow:inset 0 -4px 0 #d6c7a6}.tabs button:nth-child(even){background:#e0d7b6}.tabs button[aria-current=page]{margin-top:0;min-height:99px;background:#cadca3;border-color:#a3b984;box-shadow:inset 0 -4px 0 #aebf8e}.tabs .home img{width:39px;height:39px}
@media(max-width:380px){main{padding-inline:10px}button{font-size:9px}button img,button svg{width:26px;height:26px}.wood{gap:4px}.paper,.garden{padding-inline:5px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
<main></main>
<script type="module">
import {bottomNavigationProfileIconMarkup,calendarIconMarkup} from '../../../app/views.mjs';
const root='../../../';
const icons=[`<img src="${root}brand/icons/collections/library.svg" alt="">`,`<img src="${root}brand/icons/collections/bookcase.svg" alt="">`,`<img src="${root}brand/reed/d-compacto.svg" alt="">`,bottomNavigationProfileIconMarkup(),calendarIconMarkup()];
const labels=['Librería','Biblioteca','Inicio','Perfil','Idea del día'];
const variants=[['A · Papel ondulado','paper'],['B · Piezas de madera','wood'],['C · Bancal verde','garden'],['D · Pestañas de libro','tabs']];
document.querySelector('main').innerHTML=variants.map(([name,style])=>`<figure><figcaption>${name}</figcaption><nav class="${style}" aria-label="${name}">${labels.map((label,i)=>`<button type="button" class="${i===2?'home':''}" ${i===2?'aria-current="page"':''}>${icons[i]}<span>${label}</span></button>`).join('')}</nav></figure>`).join('');
document.querySelectorAll('nav').forEach(nav=>nav.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;nav.querySelectorAll('button').forEach(item=>item.removeAttribute('aria-current'));button.setAttribute('aria-current','page');}));
</script></html>

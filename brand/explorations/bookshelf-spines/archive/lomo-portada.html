<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lomo y portada · propuesta reservada</title><style>html{color-scheme:light dark}body{margin:0;padding:20px 10px;background:light-dark(#fff9ed,#252c24);font-family:system-ui,sans-serif}.study-switch{display:flex;justify-content:center;gap:10px;margin:12px 0 0}.study-switch button{padding:10px 16px;border:1px solid #779a72;border-radius:12px;background:light-dark(#fff9ed,#252c24);color:light-dark(#173d2c,#eeefdf);font:650 14px system-ui,sans-serif;touch-action:manipulation}.study-switch button[aria-pressed="true"]{background:light-dark(#e4f0cc,#3c4b33)}</style><style>
    #reed-spine-proposals .rs-stage{min-height:782px;padding:18px 8px 24px;box-sizing:border-box}
    #reed-spine-proposals .rs-phone{--paper:light-dark(#fff9ed,#252c24);--ink:light-dark(#173d2c,#f1eddb);--muted-ink:light-dark(#51654c,#c4cbb8);--wood:light-dark(#e8d3a4,#756443);--wood-edge:light-dark(#bca06d,#51472e);--hairline:light-dark(#dadcc9,#515b46);box-sizing:border-box;max-width:398px;min-height:722px;margin:auto;background:var(--paper);color:var(--ink);border:1px solid var(--hairline);border-radius:24px;box-shadow:0 8px 24px light-dark(#173d2c12,#00000032);font-family:"Nunito Sans","Avenir Next",system-ui,sans-serif;overflow-wrap:anywhere}
    #reed-spine-proposals .rs-header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:26px 22px 18px}
    #reed-spine-proposals .rs-header h2{margin:0;font:850 24px/1.2 "Nunito Sans","Avenir Next",system-ui,sans-serif;letter-spacing:-.6px;color:var(--ink)}
    #reed-spine-proposals .rs-count{font-size:12px;color:var(--muted-ink);white-space:nowrap}
    #reed-spine-proposals .rs-shelves{padding:6px 19px 0}
    #reed-spine-proposals .rs-shelf{position:relative;display:flex;align-items:flex-end;gap:4px;height:248px;padding:0 2px 12px;margin-bottom:21px;box-sizing:border-box;isolation:isolate}
    #reed-spine-proposals .rs-shelf:after{content:"";position:absolute;left:-8px;right:-8px;bottom:0;height:11px;border-radius:3px 3px 5px 5px;background:linear-gradient(var(--wood),var(--wood));border-top:1px solid light-dark(#f7e7c4,#a28c5d);box-shadow:0 4px 0 var(--wood-edge),0 9px 12px light-dark(#173d2c14,#00000028);z-index:-1}
    #reed-spine-proposals .rs-book{--book-ink:light-dark(#173d2c,#efeddf);--jacket:light-dark(#d9edb6,#46583c);position:relative;display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;height:var(--height);padding:12px 5px 9px;border:1px solid light-dark(#173d2c52,#d4ddbe35);border-radius:7px 5px 4px 6px;background:linear-gradient(90deg,light-dark(#173d2c10,#00000020),transparent 16%,light-dark(#ffffff35,#ffffff09) 45%,transparent 84%,light-dark(#173d2c1c,#00000030)),var(--jacket);color:var(--book-ink);box-shadow:2px 1px 0 light-dark(#173d2c38,#00000055),inset 2px 0 0 light-dark(#ffffff4d,#ffffff14);text-align:center;font:inherit;transition:transform .22s ease,flex .28s ease;box-sizing:border-box;touch-action:manipulation}
    #reed-spine-proposals .rs-book:before,#reed-spine-proposals .rs-book:after{content:"";display:block;flex:none;width:82%;height:3px;border-top:1px solid currentColor;border-bottom:1px solid currentColor;opacity:.24}
    #reed-spine-proposals .rs-book:before{margin-bottom:9px}
    #reed-spine-proposals .rs-book:after{margin-top:7px;height:2px}
    #reed-spine-proposals .rs-book .rs-title{display:block;flex:1;min-height:0;width:100%;writing-mode:vertical-rl;text-orientation:mixed;text-align:left;font-size:14px;font-weight:800;line-height:1.1;letter-spacing:-.15px;overflow-wrap:normal}
    #reed-spine-proposals .rs-book .rs-author{display:block;flex:none;width:100%;margin-top:8px;min-height:25px;font-size:11px;font-weight:650;line-height:1.15;text-align:center;overflow-wrap:normal}
    #reed-spine-proposals .rs-book[aria-pressed="true"]{transform:translateY(-10px) rotate(-1deg);box-shadow:3px 5px 0 light-dark(#173d2c38,#00000055),0 8px 12px light-dark(#173d2c19,#00000022)}
    #reed-spine-proposals .rs-sage{--jacket:light-dark(#d9edb6,#46583c)}
    #reed-spine-proposals .rs-peach{--jacket:light-dark(#f3d8b2,#684e38)}
    #reed-spine-proposals .rs-forest{--jacket:light-dark(#376c49,#294e36);--book-ink:light-dark(#fff9ed,#f3f0df)}
    #reed-spine-proposals .rs-cream{--jacket:light-dark(#f2e8bb,#655e3f)}
    #reed-spine-proposals .rs-blue{--jacket:light-dark(#d7e5ee,#3e5460)}
    #reed-spine-proposals .rs-wood{--jacket:light-dark(#e8d3a4,#6c5b3d)}
    #reed-spine-proposals .rs-olive{--jacket:light-dark(#bbcc9a,#4e5d3a)}
    #reed-spine-proposals .rs-selection{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:57px;margin:0;padding:3px 18px 18px;text-align:center;font-size:13px;line-height:1.25;color:var(--ink)}
    #reed-spine-proposals .rs-selection strong{font-weight:750}
    #reed-spine-proposals .rs-selection span{font-size:11px;color:var(--muted-ink)}
    #reed-spine-proposals .rs-pile{display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding:8px 23px 20px;min-height:552px;box-sizing:border-box}
    #reed-spine-proposals .rs-pile .rs-book{flex:none;flex-direction:row;align-items:center;justify-content:flex-start;gap:11px;width:var(--width);height:auto;min-height:47px;padding:7px 13px;border-radius:5px 8px 8px 5px;transform:rotate(var(--tilt));box-shadow:0 3px 0 light-dark(#173d2c30,#00000055),inset 4px 0 0 light-dark(#ffffff4d,#ffffff12);text-align:left}
    #reed-spine-proposals .rs-pile .rs-book:before{align-self:stretch;width:3px;height:auto;margin:1px 0;border:0;border-left:1px solid currentColor;border-right:1px solid currentColor;opacity:.22}
    #reed-spine-proposals .rs-pile .rs-book:after{display:none}
    #reed-spine-proposals .rs-stack-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:3px}
    #reed-spine-proposals .rs-pile .rs-title{writing-mode:horizontal-tb;font-size:14px;line-height:1.12;flex:none}
    #reed-spine-proposals .rs-pile .rs-author{margin:0;min-height:0;text-align:left;font-size:11px;line-height:1.15}
    #reed-spine-proposals .rs-pile .rs-book[aria-pressed="true"]{transform:translateX(9px) rotate(var(--tilt));box-shadow:0 4px 0 light-dark(#173d2c38,#00000055),-7px 2px 12px light-dark(#173d2c14,#00000028)}
    #reed-spine-proposals .rs-open-shelf{gap:4px;padding-left:0;padding-right:0}
    #reed-spine-proposals .rs-open-shelf .rs-book{height:220px;padding:12px 4px 10px;flex:1;border-radius:6px 4px 3px 5px}
    #reed-spine-proposals .rs-open-shelf .rs-title{font-size:12px;line-height:1.02}
    #reed-spine-proposals .rs-open-shelf .rs-author{display:none}
    #reed-spine-proposals .rs-open-shelf .rs-book[aria-pressed="true"]{flex:4.2;align-items:flex-start;justify-content:flex-start;height:233px;padding:19px 12px 15px;transform:translateY(-2px) rotate(-2deg);border-radius:3px 9px 9px 3px;box-shadow:4px 1px 0 light-dark(#eee9d8,#c3c0ae),6px 3px 0 light-dark(#bca06d,#716747),8px 7px 12px light-dark(#173d2c22,#00000044);background:linear-gradient(90deg,light-dark(#173d2c13,#00000035) 0 6px,transparent 6px),var(--jacket)}
    #reed-spine-proposals .rs-open-shelf .rs-book[aria-pressed="true"]:before{width:26px;height:0;margin:0 0 13px;border:0;border-top:3px solid currentColor;opacity:.5}
    #reed-spine-proposals .rs-open-shelf .rs-book[aria-pressed="true"] .rs-title{writing-mode:horizontal-tb;font-size:21px;font-weight:850;line-height:1.04;letter-spacing:-.7px;flex:1;overflow-wrap:normal}
    #reed-spine-proposals .rs-open-shelf .rs-book[aria-pressed="true"] .rs-author{display:block;min-height:0;text-align:left;font-size:11px;line-height:1.2}
    #reed-spine-proposals .rs-open-shelf .rs-book[aria-pressed="true"]:after{width:26px;align-self:flex-start}
    @media(max-width:370px){#reed-spine-proposals .rs-stage{min-height:782px;padding-left:0;padding-right:0}#reed-spine-proposals .rs-header{padding-left:18px;padding-right:18px}#reed-spine-proposals .rs-shelves{padding-left:14px;padding-right:14px}#reed-spine-proposals .rs-book{padding-left:4px;padding-right:4px}#reed-spine-proposals .rs-book .rs-title{font-size:13px}#reed-spine-proposals .rs-book .rs-author{font-size:11px}#reed-spine-proposals .rs-pile{padding-left:17px;padding-right:17px}#reed-spine-proposals .rs-open-shelf .rs-book{padding-left:3px;padding-right:3px}#reed-spine-proposals .rs-open-shelf .rs-title{font-size:12px}#reed-spine-proposals .rs-open-shelf .rs-book[aria-pressed="true"]{padding-left:11px;padding-right:9px}#reed-spine-proposals .rs-open-shelf .rs-book[aria-pressed="true"] .rs-title{font-size:19px}}
    @media(prefers-reduced-motion:reduce){#reed-spine-proposals .rs-book{transition:none}}
  </style></head><body><div id="reed-spine-proposals"><section class="rs-stage" data-variant="Lomo y portada" aria-label="Lomos con una portada desplegada por estante">
    <div class="rs-phone" data-design="open">
      <header class="rs-header"><h2>Estantería</h2><span class="rs-count">10 libros</span></header>
      <div class="rs-shelves"><div class="rs-shelf rs-open-shelf" data-row="0"></div><div class="rs-shelf rs-open-shelf" data-row="1"></div></div>
      <p class="rs-selection" aria-live="polite"></p>
    </div>
  </section></div><script>
(() => {
  const root=document.getElementById('reed-spine-proposals');
  const books=[
    {title:'Los 7 hábitos de la gente altamente efectiva',author:'Stephen R. Covey',short:'S. R. Covey',color:'sage',height:233,width:100,tilt:-.5},
    {title:'Getting Things Done',author:'David Allen',short:'D. Allen',color:'peach',height:215,width:90,tilt:.7},
    {title:'Hábitos atómicos',author:'James Clear',short:'J. Clear',color:'forest',height:224,width:96,tilt:-.4},
    {title:'Tidy First?',author:'Kent Beck',short:'K. Beck',color:'cream',height:199,width:84,tilt:1},
    {title:'Surrounded by Idiots',author:'Thomas Erikson',short:'T. Erikson',color:'blue',height:230,width:94,tilt:-.5},
    {title:'Un paseo aleatorio por Wall Street',author:'Burton G. Malkiel',short:'B. G. Malkiel',color:'wood',height:233,width:100,tilt:.3},
    {title:'Padre rico, padre pobre',author:'Robert T. Kiyosaki',short:'R. Kiyosaki',color:'olive',height:216,width:92,tilt:-.6},
    {title:'El hombre más rico de Babilonia',author:'George S. Clason',short:'G. S. Clason',color:'peach',height:227,width:96,tilt:.5},
    {title:'Invierte en ti',author:'Natalia de Santiago',short:'N. de Santiago',color:'sage',height:207,width:85,tilt:-.6},
    {title:'Turn the Ship Around!',author:'L. David Marquet',short:'D. Marquet',color:'forest',height:222,width:94,tilt:.4}
  ];
  const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function bookMarkup(book,index,pile){
    const title='<span class="rs-title">'+escape(book.title)+'</span>';
    const author='<span class="rs-author">'+escape(pile?book.author:book.short)+'</span>';
    return '<button class="rs-book rs-'+book.color+' cursor-interaction" type="button" data-book="'+index+'" aria-label="'+escape(book.title+', '+book.author)+'" aria-pressed="false" style="--height:'+book.height+'px;--width:'+book.width+'%;--tilt:'+book.tilt+'deg">'+(pile?'<span class="rs-stack-copy">'+title+author+'</span>':title+author)+'</button>';
  }
  root.querySelectorAll('[data-design]').forEach(phone=>{
    const design=phone.dataset.design;
    if(design==='piles')phone.querySelector('.rs-pile').innerHTML=books.map((b,i)=>bookMarkup(b,i,true)).join('');
    else phone.querySelectorAll('[data-row]').forEach(row=>{
      const first=Number(row.dataset.row)*5;
      row.innerHTML=books.slice(first,first+5).map((b,i)=>bookMarkup(b,first+i,false)).join('');
    });
    function select(index){
      const book=books[index];
      if(design==='open'){
        const row=phone.querySelector('[data-row="'+Math.floor(index/5)+'"]');
        row.querySelectorAll('[data-book]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.book)===index)));
      }else phone.querySelectorAll('[data-book]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.book)===index)));
      phone.querySelector('.rs-selection').innerHTML='<strong>'+escape(book.title)+'</strong><span>'+escape(book.author)+'</span>';
    }
    phone.addEventListener('click',event=>{
      const button=event.target.closest('[data-book]');
      if(button&&phone.contains(button))select(Number(button.dataset.book));
    });
    if(design==='open'){select(8);select(3);}else select(1);
  });
})();
</script></body></html>

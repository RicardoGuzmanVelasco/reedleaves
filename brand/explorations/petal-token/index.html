<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exploración · icono de pétalo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; color: #173d2c; background: #f8f3e8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 22px; }
    main { max-width: 680px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.03em; }
    p { margin: 0; line-height: 1.5; color: #42624c; }
    article { display: flex; align-items: center; gap: 28px; margin-top: 26px; padding: 24px; border: 1.5px solid #d6dfc8; border-radius: 24px; background: #fffdf6; box-shadow: 0 5px 0 #e6e2d2; }
    .large { width: 128px; height: 128px; flex: none; }
    .small { width: 32px; height: 32px; vertical-align: middle; margin-left: 8px; }
    h2 { margin: 0 0 6px; font-size: 17px; }
    .desc { font-size: 14px; }
    @media (max-width: 480px) { body { padding: 24px 14px; } article { gap: 16px; padding: 16px; } .large { width: 92px; height: 92px; } }
  </style>
</head>
<body>
  <main>
    <h1>Propuesta de pétalo</h1>
    <p>Silueta basada en tu referencia, en rosa y con el contorno verde del icono actual.</p>
    <article>
      <svg class="large" viewBox="0 0 100 100" role="img" aria-label="Icono de pétalo con forma de gota">
        <path d="M18 88C12 61 23 31 44 16C59 5 74 7 82 17C95 35 74 55 51 67C36 75 25 78 18 88Z" fill="#F4A6A0" stroke="#173D2C" stroke-width="4.8" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div><h2>Forma de gota, en diagonal</h2><p class="desc">Punta abajo a la izquierda; también se aprecia en tamaño de monedero <svg class="small" viewBox="0 0 100 100" aria-hidden="true"><path d="M18 88C12 61 23 31 44 16C59 5 74 7 82 17C95 35 74 55 51 67C36 75 25 78 18 88Z" fill="#F4A6A0" stroke="#173D2C" stroke-width="4.8" stroke-linejoin="round" stroke-linecap="round"/></svg></p></div>
    </article>
  </main>
</body>
</html>

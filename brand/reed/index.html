<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Reedleaves · Identidad</title>
  <style>
    :root{color-scheme:light;--paper:#fff9ed;--ink:#173d2c;--green:#369247;--soft:#e8f3df}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
    header,main,footer{width:min(760px,calc(100% - 40px));margin:auto}header,footer{display:flex;justify-content:space-between;gap:20px;padding:22px 0}header{border-bottom:1px solid #d7dfd0}a{color:var(--ink)}
    main{padding:64px 0 72px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em}h1{font-size:clamp(32px,7vw,56px);line-height:1.05;margin:10px 0 16px}p{max-width:55ch}.identity{display:flex;align-items:center;gap:clamp(28px,8vw,80px);margin-top:46px}.identity img{width:min(42vw,220px);height:auto;border-radius:28px;background:var(--paper)}.identity-copy{flex:1}.identity-copy p{margin:10px 0}.tag{display:inline-block;margin-top:14px;padding:5px 11px;border-radius:99px;background:var(--soft);font-size:13px}
    @media(max-width:520px){header{font-size:14px}main{padding-top:40px}.identity{align-items:flex-start;flex-direction:column}.identity img{width:156px}}
  </style>
</head>
<body>
  <header><strong>Reedleaves</strong><span>Identidad de la app</span></header>
  <main>
    <p class="eyebrow">SÍMBOLO ACTUAL</p>
    <h1>De hoja a hoja.</h1>
    <p>Brote, con su expresión alegre, es el símbolo y el icono de Reedleaves.</p>
    <section class="identity" aria-label="Brote, símbolo de Reedleaves">
      <img src="app-icon.svg" width="220" height="220" alt="Brote sonriente sobre fondo crema">
      <div class="identity-copy"><h2>Reedleaves</h2><p>El icono usa la mascota sonriente sobre el fondo crema de la marca.</p><a href="app-icon.svg" download>Descargar el SVG ↗</a><br><span class="tag">Read. Plant a seed.</span></div>
    </section>
  </main>
  <footer><span>Reedleaves</span><a href="README.md">Notas de identidad ↗</a></footer>
</body>
</html>

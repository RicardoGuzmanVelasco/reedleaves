<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="/app/mascot-art.css?v=sleep-1">

  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff9ed;color:#173d2c;font-family:"Avenir Next",system-ui,sans-serif}main{width:min(1080px,calc(100% - 32px));margin:auto;padding:26px 0 64px}a{color:inherit;text-underline-offset:3px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}h1{font-size:clamp(27px,5vw,44px);line-height:1.1;letter-spacing:-.04em;margin:0}button{font:inherit;font-weight:750;color:#173d2c;background:#b9e877;border:1px solid #779a72;border-radius:15px;min-height:44px;padding:9px 18px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #865311;outline-offset:4px}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.panel{background:#e4f0cc;border-radius:30px;padding:22px;min-height:360px}.panel:nth-child(2){background:#e8d3a4}.panel h2,.stages h2{margin:0;font-size:18px}.hero-art{display:grid;place-items:center;min-height:300px}.hero-art .mascot-art{width:min(290px,70vw);height:min(290px,70vw)}.stages{margin-top:30px}.gallery{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:14px}.gallery figure{margin:0;background:#e4f0cc;border-radius:20px;display:grid;place-items:center;gap:4px;padding:14px 5px 12px}.gallery .mascot-art{width:112px;height:112px;max-width:100%}.gallery figcaption{font-size:13px;font-weight:750}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.hero{grid-template-columns:1fr}.panel{min-height:310px}.hero-art{min-height:250px}.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:400px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body><main>
  <header><div><a href="../composition.html">← Estudio de mascotas</a><h1>Animación de sueño</h1></div><button type="button" id="replay">Repetir</button></header>

  <section class="stages"><h2>Otras etapas</h2><div class="gallery" id="sleep-gallery"></div></section>
</main></body>

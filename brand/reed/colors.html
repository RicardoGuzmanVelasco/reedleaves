<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Reedleaves · Estudio histórico de color</title>
  <style>
    :root{color-scheme:light;--paper:#fff9ed;--ink:#173d2c;--green:#369247}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
    main{width:min(640px,calc(100% - 40px));margin:12vh auto}p{max-width:58ch}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em}h1{font-size:clamp(30px,6vw,48px);line-height:1.1}a{color:var(--ink)}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ARCHIVO DE DISEÑO</p>
    <h1>Estudio de color retirado</h1>
    <p>Las pruebas del antiguo logo de libro y hoja se conservan como archivos, pero ya no forman parte de la identidad de Reedleaves.</p>
    <p>El símbolo actual es Brote sonriente, sin libro.</p>
    <a href="index.html">Ver la identidad actual ↗</a>
  </main>
</body>
</html>

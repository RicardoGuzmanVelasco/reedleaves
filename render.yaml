services:
  - type: web
    name: reedleaves
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REED_INVITE_CODE
        generateValue: true
